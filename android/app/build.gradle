apply plugin: 'com.android.application'

def getCommitCount = {
    try {
        return 'git rev-list --count HEAD'.execute().text.trim().toInteger() + 50
    } catch (Exception e) {
        return 100
    }
}

android {
    namespace 'com.financeme.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.financeme.app"
        minSdk 22
        targetSdk 34
        versionCode getCommitCount()
        versionName "1.0." + getCommitCount()
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "financeme123"
            keyAlias "financeme"
            keyPassword "financeme123"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
