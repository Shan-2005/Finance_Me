name: Build Android APK & Publish Git Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK on Git Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle Wrapper
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: List APK output directory
        if: always()
        run: |
          echo "=== Build output ==="
          find android/app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK files found"
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug APK dir does not exist"

      - name: Upload Built APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Finance-Me-App-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
