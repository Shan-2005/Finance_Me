name: Build Android APK & Publish Git Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK on Git Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle Wrapper
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../build.log
        continue-on-error: false

      - name: Show build log on failure
        if: failure()
        run: tail -n 300 build.log || true

      - name: Upload Built APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Finance-Me-App-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
