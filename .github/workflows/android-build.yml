name: Build Android APK & Publish Git Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK on Git Push
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle Wrapper
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Distribution File
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Finance-Me.apk

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finance-Me-App-debug.apk
          path: dist/Finance-Me.apk

      - name: Update GitHub Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Finance Me Latest Build"
          body: "Automatic build generated from GitHub Actions pipeline."
          files: dist/Finance-Me.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
